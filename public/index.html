<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ouverture / Fermeture des Feed</title>

  <style>
    :root {
      --orange-rg: #c95d2b;
      --green-rg: #006b4d;
      --blue-rg: #0f6680;
      --grey-line: #c9ced3;
      --grey-line-alt: #e6e9ec;
      --white: #ffffff;
      --black: #111111;

      --screen-padding: clamp(8px, 1.5vw, 24px);

      --orange-height: clamp(150px, 20vh, 230px);
      --logo-size: clamp(120px, 11vw, 190px);
      --title-size: clamp(28px, 3.1vw, 52px);

      --green-height: clamp(48px, 7vh, 76px);
      --gap-after-green: 0px;

      --date-size: clamp(20px, 2.8vw, 44px);

      --table-header-size: clamp(14px, 1.35vw, 24px);
      --table-text-size: clamp(14px, 1.25vw, 22px);
      --row-height: clamp(32px, 4.2vh, 46px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      overflow: hidden;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      padding: var(--screen-padding);
      background: #f2f2f2;
    }

    .container {
      width: 100%;
      height: 100%;
      background: white;
      border: 1px solid #dddddd;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top-band {
      height: var(--orange-height);
      min-height: var(--orange-height);
      background: var(--orange-rg);
      display: grid;
      grid-template-columns: minmax(180px, 20vw) 1fr minmax(180px, 20vw);
      align-items: center;
      justify-items: center;
      padding: 0 clamp(24px, 4vw, 70px) clamp(8px, 1.2vh, 16px);
      overflow: hidden;
    }

    .logo {
      width: var(--logo-size);
      height: var(--logo-size);
      object-fit: contain;
      display: block;
    }

    .logo.left {
      justify-self: start;
      align-self: center;
    }

    .logo.right {
      justify-self: center;
      align-self: center;
    }

    .hidden-edit-btn {
      width: var(--logo-size);
      height: var(--logo-size);
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      cursor: default;
      justify-self: end;
      align-self: center;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
    }

    .hidden-edit-btn .logo {
      pointer-events: none;
    }

    .main-title {
      height: 100%;
      text-align: center;
      font-size: var(--title-size);
      font-weight: 900;
      letter-spacing: clamp(1px, 0.15vw, 2px);
      text-transform: uppercase;
      line-height: 0.95;
      color: white;
      white-space: normal;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .main-title span {
      display: block;
      width: 100%;
      text-align: center;
    }

    .green-info-bar {
      height: var(--green-height);
      min-height: var(--green-height);
      background: var(--green-rg);
      display: grid;
      grid-template-columns: minmax(150px, 18vw) 1fr minmax(220px, 24vw);
      align-items: center;
      padding: 0 clamp(16px, 3vw, 50px);
      border-top: 3px solid white;
    }

    .green-actions {
      grid-column: 1;
      justify-self: start;
      align-self: center;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .fullscreen-btn,
    .sound-btn {
      width: 46px;
      height: 46px;
      border: 2px solid white;
      border-radius: 8px;
      background: transparent;
      color: white;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      line-height: 1;
    }

    .fullscreen-btn:hover,
    .sound-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .fullscreen-btn:active,
    .sound-btn:active {
      transform: scale(0.96);
    }

    .sound-btn.sound-enabled {
      background: rgba(255, 255, 255, 0.22);
    }

    .edit-indicator {
      display: none;
      color: white;
      font-size: 30px;
      font-weight: 900;
      line-height: 1;
    }

    .edit-indicator.visible {
      display: inline-block;
    }

    .date-zone {
      grid-column: 2;
      text-align: center;
      font-size: var(--date-size);
      font-weight: 900;
      text-transform: uppercase;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .clock-report-zone {
      grid-column: 3;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .clock-zone {
      text-align: right;
      font-size: var(--date-size);
      font-weight: 900;
      text-transform: uppercase;
      color: white;
      white-space: nowrap;
    }

    .report-btn {
      border: 2px solid white;
      border-radius: 8px;
      background: transparent;
      color: white;
      font-size: clamp(14px, 1.1vw, 20px);
      font-weight: 900;
      padding: 8px 14px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .report-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .report-btn:not(:disabled):hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .table-zone {
      flex: 1;
      background: white;
      padding-top: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    .schedule {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }

    .schedule thead {
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .schedule thead tr {
      background: var(--blue-rg);
      height: var(--row-height);
    }

    .schedule th {
      position: sticky;
      top: 0;
      z-index: 21;
      background: var(--blue-rg);
      color: white;
      text-align: left;
      font-size: var(--table-header-size);
      padding: clamp(4px, 0.7vw, 8px) clamp(7px, 1vw, 12px);
      border: 2px solid white;
      font-weight: 900;
      white-space: nowrap;
      vertical-align: middle;
    }

    .schedule td {
      height: var(--row-height);
      font-size: var(--table-text-size);
      color: var(--black);
      padding: clamp(4px, 0.7vw, 8px) clamp(7px, 1vw, 12px);
      border: 2px solid white;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }

    .schedule tbody tr {
      background: var(--grey-line);
    }

    .schedule tbody tr:nth-child(even) {
      background: var(--grey-line-alt);
    }

    .schedule tr,
    .schedule td,
    .schedule th {
      outline: none !important;
      box-shadow: none !important;
    }

    .overdue-unclosed td {
      color: #d00000 !important;
      font-weight: 900;
    }

    .overdue-unclosed .close-time-input {
      color: #d00000 !important;
      font-weight: 900;
    }

    .overdue-unclosed .close-time-input:disabled {
      color: #d00000 !important;
    }

    .pending-remove {
      opacity: 0.55;
      transition: opacity 0.3s ease;
    }

    .pending-remove td {
      text-decoration: line-through;
    }

    .col-time,
    .col-court,
    .col-close {
      width: 1%;
      white-space: nowrap;
    }

    .col-close-time {
      width: 1%;
      min-width: 200px;
      white-space: nowrap;
    }

    .col-feed {
      width: auto;
    }

    .schedule td:nth-child(1),
    .schedule td:nth-child(2),
    .schedule td:nth-child(4),
    .schedule td:nth-child(5) {
      width: 1%;
      white-space: nowrap;
    }

    .schedule td:nth-child(3) {
      width: auto;
      white-space: normal;
    }

    .schedule th:nth-child(1),
    .schedule td:nth-child(1),
    .schedule th:nth-child(4),
    .schedule td:nth-child(4),
    .schedule th:nth-child(5),
    .schedule td:nth-child(5) {
      text-align: center;
    }

    .schedule th:nth-child(1),
    .schedule th:nth-child(5) {
      white-space: normal;
      line-height: 1.05;
    }

    .close-checkbox {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: var(--green-rg);
    }

    .close-checkbox:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .close-time-input {
      width: 130px;
      max-width: 100%;
      font-size: clamp(14px, 1.25vw, 22px);
      font-weight: 900;
      padding: 4px 7px;
      border: 2px solid #ffffff;
      background: #ffffff;
      color: #111111;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0 auto;
      display: block;
    }

    .close-time-input:disabled {
      background: #eeeeee;
      color: #555555;
      cursor: not-allowed;
    }

    .close-time-input:focus {
      outline: 3px solid var(--blue-rg) !important;
    }

    .saving {
      opacity: 0.6;
    }

    .empty-message {
      text-align: center;
      color: #333333;
      font-size: clamp(18px, 1.8vw, 26px);
      padding: 24px;
    }

    .warning {
      animation: blinkRed 0.8s infinite;
    }

    .warning td {
      color: white;
      font-weight: 900;
    }

    .warning .close-time-input {
      color: #111111;
    }

    .warning .close-time-input:disabled {
      color: #555555;
    }

    @keyframes blinkRed {
      0% {
        background: #9b0000;
      }

      50% {
        background: #ff0000;
      }

      100% {
        background: #9b0000;
      }
    }

    .past {
      opacity: 0.35;
    }

    .past .close-checkbox,
    .past .close-time-input {
      opacity: 1;
    }

    /* =========================
       MODALE REPORT
    ========================= */

    .report-modal.hidden {
      display: none;
    }

    .report-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .report-modal-content {
      width: min(1100px, 96vw);
      max-height: 92vh;
      background: white;
      color: #111111;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .report-modal-header {
      background: var(--orange-rg);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .report-modal-header h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .report-close-btn {
      width: 42px;
      height: 42px;
      border: 2px solid white;
      border-radius: 8px;
      background: transparent;
      color: white;
      font-size: 28px;
      font-weight: 900;
      cursor: pointer;
      line-height: 1;
    }

    .report-modal-body {
      padding: 18px 20px;
      overflow-y: auto;
    }

    .report-date {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 12px;
      color: var(--green-rg);
    }

    .report-table-wrapper {
      overflow-x: auto;
      margin-bottom: 16px;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
    }

    .report-table th {
      background: var(--blue-rg);
      color: white;
      font-weight: 900;
      padding: 10px;
      border: 2px solid white;
      text-align: left;
    }

    .report-table td {
      background: #e6e9ec;
      color: #111111;
      font-weight: 700;
      padding: 10px;
      border: 2px solid white;
    }

    .report-remark-label {
      display: block;
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 8px;
      color: #111111;
    }

    .report-remark {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      font-size: 17px;
      font-family: Arial, Helvetica, sans-serif;
      padding: 12px;
      border: 2px solid var(--blue-rg);
      border-radius: 8px;
    }

    .report-modal-footer {
      padding: 14px 20px;
      background: #f2f2f2;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .report-save-btn,
    .report-send-btn {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
    }

    .report-save-btn {
      background: var(--green-rg);
      color: white;
    }

    .report-send-btn {
      background: var(--blue-rg);
      color: white;
    }

    .report-send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    @media (max-width: 900px) {
      :root {
        --orange-height: clamp(120px, 17vh, 170px);
        --green-height: clamp(42px, 6vh, 60px);
        --gap-after-green: 0px;
        --logo-size: clamp(90px, 14vw, 120px);
        --title-size: clamp(22px, 5vw, 38px);
        --date-size: clamp(16px, 3.6vw, 24px);
        --table-header-size: clamp(13px, 3.2vw, 20px);
        --table-text-size: clamp(13px, 3vw, 18px);
        --row-height: clamp(32px, 4.2vh, 44px);
      }

      .top-band {
        grid-template-columns: 110px 1fr 110px;
        padding: 0 16px 8px;
      }

      .green-info-bar {
        grid-template-columns: 145px 1fr 190px;
        padding: 0 16px;
      }

      .fullscreen-btn,
      .sound-btn {
        width: 40px;
        height: 40px;
        font-size: 22px;
      }

      .edit-indicator {
        font-size: 26px;
      }

      .schedule th,
      .schedule td {
        padding-left: 6px;
        padding-right: 6px;
      }

      .col-close-time {
        min-width: 170px;
      }

      .close-time-input {
        width: 115px;
      }
    }

    /* =========================
       TÉLÉPHONE
    ========================= */

    @media (max-width: 600px) {
      :root {
        --screen-padding: 0px;
        --orange-height: auto;
        --green-height: auto;
        --gap-after-green: 0px;
        --logo-size: 54px;
        --title-size: 17px;
        --date-size: 16px;
        --table-header-size: 16px;
        --table-text-size: 16px;
        --row-height: auto;
      }

      html,
      body {
        width: 100%;
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        background: white;
      }

      .screen {
        width: 100%;
        min-height: 100vh;
        height: auto;
        padding: 0;
        background: white;
      }

      .container {
        width: 100%;
        min-height: 100vh;
        height: auto;
        border: none;
        overflow: visible;
      }

      .top-band {
        height: auto;
        min-height: 82px;
        grid-template-columns: 58px 1fr 58px;
        align-items: center;
        padding: 6px 8px;
      }

      .logo {
        width: var(--logo-size);
        height: var(--logo-size);
      }

      .hidden-edit-btn {
        width: var(--logo-size);
        height: var(--logo-size);
      }

      .main-title {
        font-size: var(--title-size);
        line-height: 1.05;
        letter-spacing: 0.5px;
        text-align: center;
      }

      .green-info-bar {
        height: auto;
        min-height: 92px;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        gap: 5px;
        padding: 8px 10px;
        border-top: 2px solid white;
      }

      .green-actions {
        grid-column: 1;
        grid-row: 3;
        justify-self: center;
        margin-top: 2px;
      }

      .fullscreen-btn,
      .sound-btn {
        width: 36px;
        height: 36px;
        font-size: 19px;
        border-radius: 7px;
      }

      .edit-indicator {
        font-size: 22px;
      }

      .date-zone {
        grid-column: 1;
        grid-row: 1;
        font-size: var(--date-size);
        white-space: normal;
        line-height: 1.15;
        text-align: center;
      }

      .clock-report-zone {
        grid-column: 1;
        grid-row: 2;
        justify-content: center;
        gap: 10px;
      }

      .clock-zone {
        text-align: center;
        font-size: 20px;
      }

      .report-btn {
        font-size: 13px;
        padding: 6px 10px;
      }

      .table-zone {
        padding-top: 0;
        overflow-y: visible;
        overflow-x: hidden;
        background: white;
      }

      .schedule {
        display: block;
        width: 100%;
        padding: 8px 8px 14px;
      }

      .schedule thead {
        display: none;
      }

      .schedule tbody {
        display: block;
        width: 100%;
      }

      .schedule tr {
        display: block;
        width: 100%;
        margin-bottom: 10px;
        border: 2px solid white;
        border-radius: 8px;
        overflow: hidden;
        background: var(--grey-line);
      }

      .schedule tbody tr:nth-child(even) {
        background: var(--grey-line-alt);
      }

      .schedule td {
        display: grid;
        grid-template-columns: 42% 58%;
        align-items: center;
        width: 100% !important;
        height: auto;
        min-height: 40px;
        font-size: var(--table-text-size);
        padding: 8px 10px;
        border: none;
        border-bottom: 1px solid white;
        white-space: normal !important;
        overflow: visible;
        text-overflow: unset;
        text-align: left !important;
        line-height: 1.15;
      }

      .schedule td:last-child {
        border-bottom: none;
      }

      .schedule td::before {
        font-weight: 900;
        color: var(--blue-rg);
        padding-right: 8px;
      }

      .schedule td:nth-child(1)::before {
        content: "Ouverture";
      }

      .schedule td:nth-child(2)::before {
        content: "Court";
      }

      .schedule td:nth-child(3)::before {
        content: "Feed";
      }

      .schedule td:nth-child(4)::before {
        content: "Close";
      }

      .schedule td:nth-child(5)::before {
        content: "Fermeture";
      }

      .close-checkbox {
        width: 28px;
        height: 28px;
        justify-self: start;
      }

      .close-time-input {
        width: 110px;
        font-size: 18px;
        justify-self: start;
        margin: 0;
        padding: 4px 6px;
      }

      .warning {
        animation: blinkRed 0.8s infinite;
      }

      .warning td,
      .warning td::before {
        color: white !important;
      }

      .warning .close-time-input {
        color: #111111 !important;
      }

      .warning .close-time-input:disabled {
        color: #555555 !important;
      }

      .overdue-unclosed td,
      .overdue-unclosed td::before {
        color: #d00000 !important;
        font-weight: 900;
      }

      .past {
        opacity: 0.45;
      }

      .pending-remove {
        opacity: 0.55;
      }

      .empty-message {
        display: block;
        font-size: 18px;
        padding: 24px 12px;
        text-align: center;
      }

      .report-modal {
        align-items: flex-start;
        padding: 10px;
      }

      .report-modal-content {
        width: 100%;
        max-height: 96vh;
        border-radius: 10px;
      }

      .report-modal-header {
        padding: 12px;
      }

      .report-modal-header h2 {
        font-size: 19px;
      }

      .report-close-btn {
        width: 36px;
        height: 36px;
        font-size: 24px;
      }

      .report-modal-body {
        padding: 12px;
      }

      .report-table th,
      .report-table td {
        font-size: 13px;
        padding: 7px;
      }

      .report-remark {
        min-height: 120px;
        font-size: 15px;
      }

      .report-modal-footer {
        flex-direction: column;
      }

      .report-save-btn,
      .report-send-btn {
        width: 100%;
      }
    }

    @media (min-width: 1600px) {
      :root {
        --orange-height: clamp(170px, 20vh, 250px);
        --green-height: clamp(70px, 7vh, 95px);
        --gap-after-green: 0px;
        --logo-size: clamp(170px, 9vw, 210px);
        --title-size: clamp(42px, 3.1vw, 60px);
        --date-size: clamp(38px, 2.8vw, 56px);
        --table-header-size: clamp(20px, 1.35vw, 28px);
        --table-text-size: clamp(18px, 1.25vw, 26px);
        --row-height: clamp(38px, 4.2vh, 52px);
      }

      .col-close-time {
        min-width: 250px;
      }

      .close-time-input {
        width: 150px;
      }
    }

    @media (max-height: 650px) {
      :root {
        --orange-height: 125px;
        --green-height: 42px;
        --gap-after-green: 0px;
        --logo-size: 105px;
        --title-size: 24px;
        --date-size: 18px;
        --table-header-size: 14px;
        --table-text-size: 14px;
        --row-height: 30px;
      }

      .top-band {
        grid-template-columns: 125px 1fr 125px;
        padding: 0 16px 6px;
      }

      .close-checkbox {
        width: 18px;
        height: 18px;
      }

      .close-time-input {
        width: 90px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="screen">
    <div class="container">

      <header class="top-band">
        <img src="./logo-rg.png" alt="Roland Garros" class="logo left" />

        <div class="main-title">
          <span>OUVERTURE / FERMETURE</span>
          <span>DES FEED</span>
        </div>

        <button id="hidden-edit-btn" class="hidden-edit-btn" title="">
          <img src="./logo-rg.png" alt="Roland Garros" class="logo right" />
        </button>
      </header>

      <section class="green-info-bar">
        <div class="green-actions">
          <button id="fullscreen-btn" class="fullscreen-btn" title="Plein écran">
            ⛶
          </button>

          <button id="sound-btn" class="sound-btn" title="Activer le son">
            🔇
          </button>

          <span id="edit-indicator" class="edit-indicator">✎</span>
        </div>

        <div class="date-zone" id="date-du-jour">
          DATE DU JOUR
        </div>

        <div class="clock-report-zone">
          <button id="report-btn" class="report-btn" disabled>
            Report
          </button>

          <div class="clock-zone" id="heure-actuelle">
            HEURE
          </div>
        </div>
      </section>

      <main class="table-zone" id="table-zone">
        <table class="schedule">
          <thead>
            <tr>
              <th class="col-time">Heure<br>d’ouverture</th>
              <th class="col-court">Court</th>
              <th class="col-feed">Feed</th>
              <th class="col-close">Close</th>
              <th class="col-close-time">Heure<br>de fermeture</th>
            </tr>
          </thead>

          <tbody id="schedule-body">
            <tr>
              <td colspan="5" class="empty-message">Chargement...</td>
            </tr>
          </tbody>
        </table>
      </main>

    </div>
  </div>

  <div id="report-modal" class="report-modal hidden">
    <div class="report-modal-content">
      <div class="report-modal-header">
        <h2>Report du jour</h2>
        <button id="report-close-btn" class="report-close-btn">×</button>
      </div>

      <div class="report-modal-body">
        <div id="report-date" class="report-date"></div>

        <div class="report-table-wrapper">
          <table class="report-table">
            <thead>
              <tr>
                <th>Heure ouverture</th>
                <th>Court</th>
                <th>Feed</th>
                <th>Close</th>
                <th>Heure fermeture</th>
              </tr>
            </thead>
            <tbody id="report-body">
              <tr>
                <td colspan="5">Chargement...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <label class="report-remark-label" for="report-remark">
          Remarque
        </label>

        <textarea
          id="report-remark"
          class="report-remark"
          placeholder="Ajouter une remarque..."
        ></textarea>
      </div>

      <div class="report-modal-footer">
        <button id="report-save-btn" class="report-save-btn">
          Enregistrer remarque
        </button>

        <button id="report-send-btn" class="report-send-btn" disabled>
          Envoyer
        </button>
      </div>
    </div>
  </div>

  <script>
    let events = [];
    let isEditingCloseTime = false;
    let lastAutoScrolledRecordId = null;
    let editMode = false;

    let soundEnabled = false;
    let alarmAudioContext = null;
    let alarmInterval = null;
    let alarmIsPlaying = false;

    let reportData = null;

    const pendingRemovalIds = new Set();

    function getTodayParis() {
      return new Intl.DateTimeFormat("fr-CA", {
        timeZone: "Europe/Paris",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function isOldEvent(event) {
      return event.date && event.date < getTodayParis();
    }

    function scheduleRemoveOldEvent(event) {
      if (!event || !event.id || !isOldEvent(event)) {
        return;
      }

      if (pendingRemovalIds.has(event.id)) {
        return;
      }

      pendingRemovalIds.add(event.id);

      const row = document.querySelector(`tr[data-id="${event.id}"]`);

      if (row) {
        row.classList.add("pending-remove");
      }

      setTimeout(() => {
        events = events.filter(item => item.id !== event.id);
        pendingRemovalIds.delete(event.id);
        renderSchedule();
      }, 3000);
    }

    function areAllTodayRowsClosed() {
      const todayParis = getTodayParis();
      const todayEvents = events.filter(event => event.date === todayParis);

      if (!todayEvents.length) {
        return false;
      }

      return todayEvents.every(event => event.close === true);
    }

    function updateReportButtonState() {
      const reportButton = document.getElementById("report-btn");

      if (!reportButton) {
        return;
      }

      reportButton.disabled = !areAllTodayRowsClosed();
    }

    async function openReportModal() {
      const modal = document.getElementById("report-modal");
      const reportDate = document.getElementById("report-date");
      const reportBody = document.getElementById("report-body");
      const reportRemark = document.getElementById("report-remark");

      const todayParis = getTodayParis();

      modal.classList.remove("hidden");
      reportDate.textContent = `Date : ${todayParis}`;
      reportBody.innerHTML = `
        <tr>
          <td colspan="5">Chargement...</td>
        </tr>
      `;
      reportRemark.value = "";

      try {
        const response = await fetch(`/api/report?date=${encodeURIComponent(todayParis)}`);

        if (!response.ok) {
          throw new Error("Erreur chargement report");
        }

        const data = await response.json();
        reportData = data;

        const reportEvents = data.events || [];

        if (!reportEvents.length) {
          reportBody.innerHTML = `
            <tr>
              <td colspan="5">Aucune ligne pour aujourd'hui</td>
            </tr>
          `;
        } else {
          reportBody.innerHTML = reportEvents.map(event => `
            <tr>
              <td>${event.heure || ""}</td>
              <td>${event.court || ""}</td>
              <td>${event.feed || ""}</td>
              <td>${event.close ? "Oui" : "Non"}</td>
              <td>${event.heureFermeture || ""}</td>
            </tr>
          `).join("");
        }

        reportRemark.value = data.report?.remarque || "";

      } catch (error) {
        reportBody.innerHTML = `
          <tr>
            <td colspan="5">Erreur de chargement du report</td>
          </tr>
        `;
      }
    }

    function closeReportModal() {
      const modal = document.getElementById("report-modal");

      if (modal) {
        modal.classList.add("hidden");
      }
    }

    async function saveReportRemark() {
      const reportRemark = document.getElementById("report-remark");
      const saveButton = document.getElementById("report-save-btn");

      const todayParis = getTodayParis();

      try {
        saveButton.disabled = true;
        saveButton.textContent = "Enregistrement...";

        const response = await fetch("/api/report", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            date: todayParis,
            remarque: reportRemark.value || ""
          })
        });

        if (!response.ok) {
          throw new Error("Erreur enregistrement remarque");
        }

        const data = await response.json();
        reportData = data;

        saveButton.textContent = "Remarque enregistrée";

        setTimeout(() => {
          saveButton.textContent = "Enregistrer remarque";
          saveButton.disabled = false;
        }, 1500);

      } catch (error) {
        alert("Erreur lors de l'enregistrement de la remarque");
        saveButton.textContent = "Enregistrer remarque";
        saveButton.disabled = false;
      }
    }

    function setupReportModal() {
      const reportButton = document.getElementById("report-btn");
      const closeButton = document.getElementById("report-close-btn");
      const saveButton = document.getElementById("report-save-btn");
      const sendButton = document.getElementById("report-send-btn");
      const modal = document.getElementById("report-modal");

      if (reportButton) {
        reportButton.addEventListener("click", openReportModal);
      }

      if (closeButton) {
        closeButton.addEventListener("click", closeReportModal);
      }

      if (saveButton) {
        saveButton.addEventListener("click", saveReportRemark);
      }

      if (sendButton) {
        sendButton.addEventListener("click", () => {
          alert("L'envoi PDF sera ajouté à l'étape suivante.");
        });
      }

      if (modal) {
        modal.addEventListener("click", event => {
          if (event.target === modal) {
            closeReportModal();
          }
        });
      }
    }

    function setupHiddenEditButton() {
      const hiddenButton = document.getElementById("hidden-edit-btn");
      const indicator = document.getElementById("edit-indicator");

      if (!hiddenButton || !indicator) {
        return;
      }

      hiddenButton.addEventListener("click", () => {
        editMode = !editMode;

        if (editMode) {
          indicator.classList.add("visible");
        } else {
          indicator.classList.remove("visible");
        }

        renderSchedule();
      });
    }

    function setupFullscreenButton() {
      const button = document.getElementById("fullscreen-btn");
      const target = document.documentElement;

      if (!button) {
        return;
      }

      button.addEventListener("click", async () => {
        try {
          if (!document.fullscreenElement) {
            await target.requestFullscreen();
            button.textContent = "×";
          } else {
            await document.exitFullscreen();
            button.textContent = "⛶";
          }
        } catch (error) {
          alert("Le plein écran n'est pas autorisé par ce navigateur.");
          console.error(error);
        }
      });

      document.addEventListener("fullscreenchange", () => {
        button.textContent = document.fullscreenElement ? "×" : "⛶";
      });
    }

    function setupSoundButton() {
      const button = document.getElementById("sound-btn");

      if (!button) {
        return;
      }

      button.addEventListener("click", async () => {
        soundEnabled = !soundEnabled;

        if (soundEnabled) {
          alarmAudioContext =
            alarmAudioContext ||
            new (window.AudioContext || window.webkitAudioContext)();

          if (alarmAudioContext.state === "suspended") {
            await alarmAudioContext.resume();
          }

          button.textContent = "🔊";
          button.classList.add("sound-enabled");

          playAlarmBeep();
        } else {
          button.textContent = "🔇";
          button.classList.remove("sound-enabled");
          stopAlarm();
        }
      });
    }

    function playAlarmBeep() {
      if (!soundEnabled || !alarmAudioContext) {
        return;
      }

      const oscillator = alarmAudioContext.createOscillator();
      const gain = alarmAudioContext.createGain();

      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(880, alarmAudioContext.currentTime);

      gain.gain.setValueAtTime(0.0001, alarmAudioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, alarmAudioContext.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, alarmAudioContext.currentTime + 0.35);

      oscillator.connect(gain);
      gain.connect(alarmAudioContext.destination);

      oscillator.start();
      oscillator.stop(alarmAudioContext.currentTime + 0.4);
    }

    function startAlarm() {
      if (!soundEnabled || alarmIsPlaying) {
        return;
      }

      alarmIsPlaying = true;
      playAlarmBeep();

      alarmInterval = setInterval(() => {
        playAlarmBeep();
      }, 1200);
    }

    function stopAlarm() {
      alarmIsPlaying = false;

      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
    }

    function updateDateAndClock() {
      const now = new Date();

      const dateFormatted = now.toLocaleDateString("fr-FR", {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
      });

      const timeFormatted = now.toLocaleTimeString("fr-FR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

      document.getElementById("date-du-jour").textContent = dateFormatted;
      document.getElementById("heure-actuelle").textContent = timeFormatted;
    }

    function getCurrentParisTime() {
      const now = new Date();

      return now.toLocaleTimeString("fr-FR", {
        timeZone: "Europe/Paris",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    function formatTimeInput(value) {
      const digits = value.replace(/\D/g, "").slice(0, 4);

      if (digits.length <= 2) {
        return digits;
      }

      return `${digits.slice(0, 2)}:${digits.slice(2)}`;
    }

    async function updateCloseStatus(recordId, close, heureFermeture) {
      const response = await fetch("/api/schedule", {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          recordId,
          close,
          heureFermeture
        })
      });

      if (!response.ok) {
        let errorDetails = null;

        try {
          errorDetails = await response.json();
        } catch (error) {
          errorDetails = { error: "Erreur inconnue" };
        }

        console.error(errorDetails);
        alert("Erreur lors de la mise à jour Airtable");

        throw new Error("Erreur mise à jour Airtable");
      }

      return response.json();
    }

    async function loadSchedule() {
      try {
        const response = await fetch("/api/schedule");

        if (!response.ok) {
          throw new Error("Erreur API");
        }

        const data = await response.json();

        events = Array.isArray(data) ? data : data.events || [];

        renderSchedule();

      } catch (error) {
        document.getElementById("schedule-body").innerHTML = `
          <tr>
            <td colspan="5" class="empty-message">
              Erreur de chargement du schedule
            </td>
          </tr>
        `;
      }
    }

    function getActiveRecordId(now) {
      if (!events.length) {
        return null;
      }

      let nextEvent = null;
      let nextDiff = Infinity;

      let lastPastEvent = null;
      let lastPastDiff = -Infinity;

      events.forEach(event => {
        if (!event.datetime) {
          return;
        }

        const eventDate = new Date(event.datetime);
        const diff = eventDate - now;

        if (diff > 0 && diff < nextDiff) {
          nextDiff = diff;
          nextEvent = event;
        }

        if (diff <= 0 && diff > lastPastDiff) {
          lastPastDiff = diff;
          lastPastEvent = event;
        }
      });

      if (nextEvent) {
        return nextEvent.id;
      }

      if (lastPastEvent) {
        return lastPastEvent.id;
      }

      return null;
    }

    function scrollToActiveRow(activeRowElement) {
      if (!activeRowElement || isEditingCloseTime) {
        return;
      }

      const recordId = activeRowElement.dataset.id;

      if (recordId === lastAutoScrolledRecordId) {
        return;
      }

      lastAutoScrolledRecordId = recordId;

      activeRowElement.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    function renderSchedule() {
      if (isEditingCloseTime) {
        return;
      }

      const tbody = document.getElementById("schedule-body");
      tbody.innerHTML = "";

      if (!events.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="empty-message">
              Aucun feed prévu aujourd'hui
            </td>
          </tr>
        `;
        stopAlarm();
        updateReportButtonState();
        return;
      }

      const now = new Date();
      const todayParis = getTodayParis();
      const activeRecordId = getActiveRecordId(now);

      let hasWarningLine = false;
      let activeRowElement = null;

      events.forEach(event => {
        const eventDate = new Date(event.datetime);
        const diff = eventDate - now;

        const isLessThan2Minutes = diff > 0 && diff <= 2 * 60 * 1000;
        const isPast = diff <= 0;

        const isOldUnclosed =
          event.date &&
          event.date < todayParis &&
          !event.close;

        const tr = document.createElement("tr");
        tr.dataset.id = event.id;

        if (pendingRemovalIds.has(event.id)) {
          tr.classList.add("pending-remove");
        }

        if (isLessThan2Minutes) {
          tr.classList.add("warning");
          hasWarningLine = true;
        }

        if (isPast) {
          tr.classList.add("past");
        }

        if (isOldUnclosed) {
          tr.classList.add("overdue-unclosed");
          tr.classList.remove("past");
        }

        if (event.id === activeRecordId) {
          activeRowElement = tr;
        }

        tr.innerHTML = `
          <td>${event.heure || ""}</td>
          <td>${event.court || ""}</td>
          <td>${event.feed || ""}</td>
          <td>
            <input
              type="checkbox"
              class="close-checkbox"
              data-id="${event.id}"
              ${event.close ? "checked" : ""}
              ${editMode ? "" : "disabled"}
            />
          </td>
          <td>
            <input
              type="text"
              inputmode="numeric"
              pattern="[0-9]{2}:[0-9]{2}"
              maxlength="5"
              class="close-time-input"
              data-id="${event.id}"
              value="${event.heureFermeture || ""}"
              placeholder="HH:MM"
              ${editMode ? "" : "disabled"}
            />
          </td>
        `;

        tbody.appendChild(tr);

        const checkbox = tr.querySelector(".close-checkbox");
        const closeTimeInput = tr.querySelector(".close-time-input");

        checkbox.addEventListener("change", async () => {
          if (!editMode) {
            return;
          }

          const previousClose = event.close;
          const previousHeureFermeture = event.heureFermeture || "";

          const isChecked = checkbox.checked;
          let fermetureValue = closeTimeInput.value.trim();

          if (isChecked && !fermetureValue) {
            fermetureValue = getCurrentParisTime();
            closeTimeInput.value = fermetureValue;
          }

          if (!isChecked) {
            fermetureValue = "";
            closeTimeInput.value = "";
            event.heureFermeture = "";
          }

          try {
            tr.classList.add("saving");

            await updateCloseStatus(event.id, isChecked, fermetureValue);

            event.close = isChecked;
            event.heureFermeture = fermetureValue;

            updateReportButtonState();

            if (isOldEvent(event) && isChecked) {
              scheduleRemoveOldEvent(event);
            }

          } catch (error) {
            checkbox.checked = previousClose;
            closeTimeInput.value = previousHeureFermeture;
            event.close = previousClose;
            event.heureFermeture = previousHeureFermeture;
            updateReportButtonState();

          } finally {
            tr.classList.remove("saving");
          }
        });

        closeTimeInput.addEventListener("focus", () => {
          if (!editMode) {
            closeTimeInput.blur();
            return;
          }

          isEditingCloseTime = true;
        });

        closeTimeInput.addEventListener("input", () => {
          if (!editMode) {
            return;
          }

          closeTimeInput.value = formatTimeInput(closeTimeInput.value);
        });

        closeTimeInput.addEventListener("blur", async () => {
          if (!editMode) {
            isEditingCloseTime = false;
            return;
          }

          const previousHeureFermeture = event.heureFermeture || "";
          const fermetureValue = closeTimeInput.value.trim();

          try {
            tr.classList.add("saving");

            await updateCloseStatus(event.id, checkbox.checked, fermetureValue);

            event.heureFermeture = fermetureValue;

            updateReportButtonState();

            if (isOldEvent(event) && fermetureValue) {
              scheduleRemoveOldEvent(event);
            } else {
              renderSchedule();
            }

          } catch (error) {
            closeTimeInput.value = previousHeureFermeture;
            updateReportButtonState();
            renderSchedule();

          } finally {
            tr.classList.remove("saving");
            isEditingCloseTime = false;
          }
        });

        closeTimeInput.addEventListener("keydown", (e) => {
          if (!editMode) {
            return;
          }

          if (e.key === "Enter") {
            e.preventDefault();
            closeTimeInput.blur();
          }

          if (e.key === "Escape") {
            e.preventDefault();
            closeTimeInput.value = event.heureFermeture || "";
            closeTimeInput.blur();
          }
        });
      });

      if (hasWarningLine) {
        startAlarm();
      } else {
        stopAlarm();
      }

      updateReportButtonState();
      scrollToActiveRow(activeRowElement);
    }

    setupFullscreenButton();
    setupSoundButton();
    setupHiddenEditButton();
    setupReportModal();
    updateDateAndClock();
    loadSchedule();

    setInterval(updateDateAndClock, 1000);

    setInterval(() => {
      if (!isEditingCloseTime) {
        renderSchedule();
      }
    }, 1000);

    setInterval(() => {
      if (!isEditingCloseTime) {
        loadSchedule();
      }
    }, 60000);
  </script>
</body>
</html>
