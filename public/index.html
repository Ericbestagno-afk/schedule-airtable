<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ouverture / Fermeture des Feed</title>

  <style>
    :root {
      --orange-rg: #c95d2b;
      --green-rg: #006b4d;
      --blue-rg: #0f6680;
      --grey-line: #c9ced3;
      --grey-line-alt: #e6e9ec;
      --white: #ffffff;
      --black: #111111;

      --screen-padding: clamp(8px, 1.5vw, 24px);

      --orange-height: clamp(95px, 16vh, 170px);
      --logo-size: clamp(60px, 8vw, 115px);
      --title-size: clamp(30px, 4vw, 62px);

      --green-height: clamp(48px, 7vh, 76px);
      --gap-after-green: clamp(8px, 2vh, 25px);

      --date-size: clamp(20px, 2.8vw, 44px);
      --table-header-size: clamp(18px, 2.1vw, 36px);
      --table-text-size: clamp(18px, 1.9vw, 34px);
      --row-height: clamp(44px, 6vh, 64px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      overflow: hidden;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      padding: var(--screen-padding);
      background: #f2f2f2;
    }

    .container {
      width: 100%;
      height: 100%;
      background: white;
      border: 1px solid #dddddd;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       BANDEAU ORANGE
    ========================= */

    .top-band {
      height: var(--orange-height);
      min-height: var(--orange-height);
      background: var(--orange-rg);
      display: grid;
      grid-template-columns: minmax(70px, 14vw) 1fr minmax(70px, 14vw);
      align-items: center;
      padding: clamp(6px, 1.2vw, 14px) clamp(16px, 3vw, 45px);
    }

    .logo {
      width: var(--logo-size);
      height: var(--logo-size);
      object-fit: contain;
      display: block;
      align-self: center;
    }

    .logo.left {
      justify-self: start;
    }

    .logo.right {
      justify-self: end;
    }

    .main-title {
      text-align: center;
      font-size: var(--title-size);
      font-weight: 900;
      letter-spacing: clamp(1px, 0.2vw, 3px);
      text-transform: uppercase;
      line-height: 1.05;
      color: white;
      white-space: normal;
      align-self: center;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .main-title span {
      display: block;
      width: 100%;
      text-align: center;
    }

    /* =========================
       BANDEAU VERT
    ========================= */

    .green-info-bar {
      height: var(--green-height);
      min-height: var(--green-height);
      background: var(--green-rg);
      display: grid;
      grid-template-columns: minmax(80px, 18vw) 1fr minmax(100px, 18vw);
      align-items: center;
      padding: 0 clamp(16px, 3vw, 50px);
      border-top: 3px solid white;
    }

    .date-zone {
      grid-column: 2;
      text-align: center;
      font-size: var(--date-size);
      font-weight: 900;
      text-transform: uppercase;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .clock-zone {
      grid-column: 3;
      text-align: right;
      font-size: var(--date-size);
      font-weight: 900;
      text-transform: uppercase;
      color: white;
      white-space: nowrap;
    }

    /* =========================
       TABLEAU
    ========================= */

    .table-zone {
      flex: 1;
      background: white;
      padding-top: var(--gap-after-green);
      overflow: hidden;
    }

    .schedule {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }

    .schedule thead tr {
      background: var(--blue-rg);
      height: var(--row-height);
    }

    .schedule th {
      color: white;
      text-align: left;
      font-size: var(--table-header-size);
      padding: clamp(6px, 1vw, 12px) clamp(10px, 1.4vw, 16px);
      border: 2px solid white;
      font-weight: 900;
      white-space: nowrap;
      vertical-align: middle;
    }

    .schedule td {
      height: var(--row-height);
      font-size: var(--table-text-size);
      color: var(--black);
      padding: clamp(6px, 1vw, 12px) clamp(10px, 1.4vw, 16px);
      border: 2px solid white;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }

    .schedule tbody tr {
      background: var(--grey-line);
    }

    .schedule tbody tr:nth-child(even) {
      background: var(--grey-line-alt);
    }

    .col-time,
    .col-court,
    .col-close {
      width: 1%;
      white-space: nowrap;
    }

    .col-close-time {
      width: 1%;
      min-width: 260px;
      white-space: nowrap;
    }

    .col-feed {
      width: auto;
    }

    .schedule td:nth-child(1),
    .schedule td:nth-child(2),
    .schedule td:nth-child(4),
    .schedule td:nth-child(5) {
      width: 1%;
      white-space: nowrap;
    }

    .schedule td:nth-child(3) {
      width: auto;
      white-space: normal;
    }

    /* Centrage colonnes 1, 4 et 5 */
    .schedule th:nth-child(1),
    .schedule td:nth-child(1),
    .schedule th:nth-child(4),
    .schedule td:nth-child(4),
    .schedule th:nth-child(5),
    .schedule td:nth-child(5) {
      text-align: center;
    }

    /* Retour à la ligne propre dans les titres 1 et 5 */
    .schedule th:nth-child(1),
    .schedule th:nth-child(5) {
      white-space: normal;
      line-height: 1.05;
    }

    .close-checkbox {
      width: 28px;
      height: 28px;
      cursor: pointer;
      accent-color: var(--green-rg);
    }

    .close-time-input {
      width: 180px;
      max-width: 100%;
      font-size: clamp(22px, 2.2vw, 34px);
      font-weight: 900;
      padding: 6px 10px;
      border: 2px solid #ffffff;
      background: #ffffff;
      color: #111111;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0 auto;
      display: block;
    }

    .close-time-input:focus {
      outline: 3px solid var(--blue-rg);
    }

    .saving {
      opacity: 0.6;
    }

    .empty-message {
      text-align: center;
      color: #333333;
      font-size: clamp(22px, 2.2vw, 32px);
      padding: 40px;
    }

    /* =========================
       CLIGNOTEMENT ROUGE
    ========================= */

    .warning {
      animation: blinkRed 0.8s infinite;
    }

    .warning td {
      color: white;
      font-weight: 900;
    }

    .warning .close-time-input {
      color: #111111;
    }

    @keyframes blinkRed {
      0% {
        background: #9b0000;
      }

      50% {
        background: #ff0000;
      }

      100% {
        background: #9b0000;
      }
    }

    .past {
      opacity: 0.35;
    }

    .past .close-checkbox,
    .past .close-time-input {
      opacity: 1;
    }

    /* =========================
       TABLETTES
    ========================= */

    @media (max-width: 900px) {
      :root {
        --orange-height: clamp(90px, 16vh, 150px);
        --green-height: clamp(42px, 6vh, 60px);
        --gap-after-green: clamp(6px, 1.5vh, 18px);
        --logo-size: clamp(58px, 12vw, 90px);
        --title-size: clamp(24px, 6vw, 42px);
        --date-size: clamp(16px, 3.6vw, 24px);
        --table-header-size: clamp(15px, 4vw, 24px);
        --table-text-size: clamp(15px, 3.8vw, 22px);
        --row-height: clamp(38px, 5vh, 52px);
      }

      .top-band {
        grid-template-columns: 80px 1fr 80px;
        padding: 10px 16px;
      }

      .green-info-bar {
        grid-template-columns: 80px 1fr 100px;
        padding: 0 16px;
      }

      .schedule th,
      .schedule td {
        padding-left: 8px;
        padding-right: 8px;
      }

      .col-close-time {
        min-width: 220px;
      }

      .close-time-input {
        width: 150px;
      }
    }

    /* =========================
       TÉLÉPHONE
    ========================= */

    @media (max-width: 600px) {
      :root {
        --screen-padding: 0px;
        --orange-height: auto;
        --green-height: auto;
        --gap-after-green: 8px;
        --logo-size: 58px;
        --title-size: 28px;
        --date-size: 18px;
        --table-header-size: 16px;
        --table-text-size: 18px;
        --row-height: auto;
      }

      html,
      body {
        overflow: auto;
      }

      .screen {
        width: 100%;
        min-height: 100vh;
        height: auto;
        padding: 0;
      }

      .container {
        min-height: 100vh;
        height: auto;
        border: none;
        overflow: visible;
      }

      .top-band {
        height: auto;
        min-height: 95px;
        grid-template-columns: 70px 1fr 70px;
        align-items: center;
        padding: 12px 14px;
      }

      .logo {
        width: var(--logo-size);
        height: var(--logo-size);
      }

      .main-title {
        font-size: var(--title-size);
        white-space: normal;
        line-height: 1.05;
        text-align: center;
      }

      .green-info-bar {
        height: auto;
        min-height: 58px;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        gap: 4px;
        padding: 8px 12px;
        border-top: 2px solid white;
      }

      .green-info-bar > div:first-child {
        display: none;
      }

      .date-zone {
        grid-column: 1;
        grid-row: 1;
        font-size: var(--date-size);
        white-space: normal;
        line-height: 1.15;
      }

      .clock-zone {
        grid-column: 1;
        grid-row: 2;
        text-align: center;
        font-size: 22px;
      }

      .table-zone {
        padding-top: 8px;
        overflow: visible;
      }

      .schedule {
        display: block;
        width: 100%;
        padding: 0 8px 12px 8px;
      }

      .schedule thead {
        display: none;
      }

      .schedule tbody {
        display: block;
        width: 100%;
      }

      .schedule tr {
        display: block;
        width: 100%;
        margin-bottom: 10px;
        border: 2px solid white;
        background: var(--grey-line);
      }

      .schedule tbody tr:nth-child(even) {
        background: var(--grey-line-alt);
      }

      .schedule td {
        display: grid;
        grid-template-columns: 46% 54%;
        width: 100%;
        height: auto;
        min-height: 42px;
        font-size: var(--table-text-size);
        padding: 10px 12px;
        border: none;
        border-bottom: 1px solid white;
        white-space: normal;
        overflow: visible;
        text-overflow: unset;
        text-align: left;
      }

      .schedule td:last-child {
        border-bottom: none;
      }

      .schedule td:nth-child(1),
      .schedule td:nth-child(2),
      .schedule td:nth-child(3),
      .schedule td:nth-child(4),
      .schedule td:nth-child(5) {
        width: 100%;
        white-space: normal;
        text-align: left;
      }

      .schedule td:nth-child(1)::before {
        content: "Heure d’ouverture";
        font-weight: 900;
        color: var(--blue-rg);
      }

      .schedule td:nth-child(2)::before {
        content: "Court";
        font-weight: 900;
        color: var(--blue-rg);
      }

      .schedule td:nth-child(3)::before {
        content: "Feed";
        font-weight: 900;
        color: var(--blue-rg);
      }

      .schedule td:nth-child(4)::before {
        content: "Close";
        font-weight: 900;
        color: var(--blue-rg);
      }

      .schedule td:nth-child(5)::before {
        content: "Heure de fermeture";
        font-weight: 900;
        color: var(--blue-rg);
      }

      .close-checkbox {
        width: 30px;
        height: 30px;
        justify-self: start;
      }

      .close-time-input {
        width: 130px;
        font-size: 22px;
        justify-self: start;
        margin: 0;
      }

      .warning {
        animation: blinkRed 0.8s infinite;
      }

      .warning td,
      .warning td::before {
        color: white;
      }

      .warning .close-time-input {
        color: #111111;
      }

      .past {
        opacity: 0.45;
      }

      .empty-message {
        display: block;
        font-size: 20px;
        padding: 24px 12px;
        text-align: center;
      }
    }

    /* =========================
       TRÈS GRANDS ÉCRANS TV
    ========================= */

    @media (min-width: 1600px) {
      :root {
        --orange-height: clamp(130px, 15vh, 190px);
        --green-height: clamp(70px, 7vh, 95px);
        --gap-after-green: clamp(15px, 2vh, 35px);
        --logo-size: clamp(105px, 7vw, 140px);
        --title-size: clamp(52px, 4vw, 78px);
        --date-size: clamp(38px, 2.8vw, 56px);
        --table-header-size: clamp(32px, 2vw, 44px);
        --table-text-size: clamp(30px, 1.8vw, 40px);
        --row-height: clamp(60px, 6vh, 80px);
      }

      .col-close-time {
        min-width: 320px;
      }

      .close-time-input {
        width: 210px;
      }
    }

    /* =========================
       ÉCRANS BAS EN HAUTEUR
    ========================= */

    @media (max-height: 650px) {
      :root {
        --orange-height: 90px;
        --green-height: 42px;
        --gap-after-green: 8px;
        --logo-size: 64px;
        --title-size: 32px;
        --date-size: 18px;
        --table-header-size: 18px;
        --table-text-size: 18px;
        --row-height: 38px;
      }

      .close-checkbox {
        width: 22px;
        height: 22px;
      }

      .close-time-input {
        width: 110px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="screen">
    <div class="container">

      <header class="top-band">
        <img src="./logo-rg.png" alt="Roland Garros" class="logo left" />

        <div class="main-title">
          <span>OUVERTURE / FERMETURE</span>
          <span>DES FEED</span>
        </div>

        <img src="./logo-rg.png" alt="Roland Garros" class="logo right" />
      </header>

      <section class="green-info-bar">
        <div></div>

        <div class="date-zone" id="date-du-jour">
          DATE DU JOUR
        </div>

        <div class="clock-zone" id="heure-actuelle">
          HEURE
        </div>
      </section>

      <main class="table-zone">
        <table class="schedule">
          <thead>
            <tr>
              <th class="col-time">Heure<br>d’ouverture</th>
              <th class="col-court">Court</th>
              <th class="col-feed">Feed</th>
              <th class="col-close">Close</th>
              <th class="col-close-time">Heure<br>de fermeture</th>
            </tr>
          </thead>

          <tbody id="schedule-body">
            <tr>
              <td colspan="5" class="empty-message">Chargement...</td>
            </tr>
          </tbody>
        </table>
      </main>

    </div>
  </div>

  <script>
    let events = [];
    let isEditingCloseTime = false;

    function updateDateAndClock() {
      const now = new Date();

      const dateFormatted = now.toLocaleDateString("fr-FR", {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
      });

      const timeFormatted = now.toLocaleTimeString("fr-FR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

      document.getElementById("date-du-jour").textContent = dateFormatted;
      document.getElementById("heure-actuelle").textContent = timeFormatted;
    }

    function getCurrentParisTime() {
      const now = new Date();

      return now.toLocaleTimeString("fr-FR", {
        timeZone: "Europe/Paris",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    function formatTimeInput(value) {
      const digits = value.replace(/\D/g, "").slice(0, 4);

      if (digits.length <= 2) {
        return digits;
      }

      return `${digits.slice(0, 2)}:${digits.slice(2)}`;
    }

    async function updateCloseStatus(recordId, close, heureFermeture) {
      const response = await fetch("/api/schedule", {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          recordId,
          close,
          heureFermeture
        })
      });

      if (!response.ok) {
        let errorDetails = null;

        try {
          errorDetails = await response.json();
        } catch (error) {
          errorDetails = { error: "Erreur inconnue" };
        }

        console.error(errorDetails);
        alert("Erreur lors de la mise à jour Airtable");

        throw new Error("Erreur mise à jour Airtable");
      }

      return response.json();
    }

    async function loadSchedule() {
      try {
        const response = await fetch("/api/schedule");

        if (!response.ok) {
          throw new Error("Erreur API");
        }

        const data = await response.json();

        events = Array.isArray(data) ? data : data.events || [];

        renderSchedule();

      } catch (error) {
        document.getElementById("schedule-body").innerHTML = `
          <tr>
            <td colspan="5" class="empty-message">
              Erreur de chargement du schedule
            </td>
          </tr>
        `;
      }
    }

    function renderSchedule() {
      if (isEditingCloseTime) {
        return;
      }

      const tbody = document.getElementById("schedule-body");
      tbody.innerHTML = "";

      if (!events.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="empty-message">
              Aucun feed prévu aujourd'hui
            </td>
          </tr>
        `;
        return;
      }

      const now = new Date();

      events.forEach(event => {
        const eventDate = new Date(event.datetime);
        const diff = eventDate - now;

        const isLessThan2Minutes = diff > 0 && diff <= 2 * 60 * 1000;
        const isPast = diff <= 0;

        const tr = document.createElement("tr");

        if (isLessThan2Minutes) {
          tr.classList.add("warning");
        }

        if (isPast) {
          tr.classList.add("past");
        }

        tr.innerHTML = `
          <td>${event.heure || ""}</td>
          <td>${event.court || ""}</td>
          <td>${event.feed || ""}</td>
          <td>
            <input
              type="checkbox"
              class="close-checkbox"
              data-id="${event.id}"
              ${event.close ? "checked" : ""}
            />
          </td>
          <td>
            <input
              type="text"
              inputmode="numeric"
              pattern="[0-9]{2}:[0-9]{2}"
              maxlength="5"
              class="close-time-input"
              data-id="${event.id}"
              value="${event.heureFermeture || ""}"
              placeholder="HH:MM"
            />
          </td>
        `;

        tbody.appendChild(tr);

        const checkbox = tr.querySelector(".close-checkbox");
        const closeTimeInput = tr.querySelector(".close-time-input");

        checkbox.addEventListener("change", async () => {
          const previousClose = event.close;
          const previousHeureFermeture = event.heureFermeture || "";

          const isChecked = checkbox.checked;

          let fermetureValue = closeTimeInput.value.trim();

          if (isChecked && !fermetureValue) {
            fermetureValue = getCurrentParisTime();
            closeTimeInput.value = fermetureValue;
          }

          if (!isChecked) {
            fermetureValue = "";
            closeTimeInput.value = "";
          }

          try {
            tr.classList.add("saving");

            await updateCloseStatus(event.id, isChecked, fermetureValue);

            event.close = isChecked;
            event.heureFermeture = fermetureValue;

          } catch (error) {
            checkbox.checked = previousClose;
            closeTimeInput.value = previousHeureFermeture;

          } finally {
            tr.classList.remove("saving");
          }
        });

        closeTimeInput.addEventListener("focus", () => {
          isEditingCloseTime = true;
        });

        closeTimeInput.addEventListener("input", () => {
          closeTimeInput.value = formatTimeInput(closeTimeInput.value);
        });

        closeTimeInput.addEventListener("blur", async () => {
          const previousHeureFermeture = event.heureFermeture || "";
          const fermetureValue = closeTimeInput.value.trim();

          try {
            tr.classList.add("saving");

            await updateCloseStatus(event.id, checkbox.checked, fermetureValue);

            event.heureFermeture = fermetureValue;

          } catch (error) {
            closeTimeInput.value = previousHeureFermeture;

          } finally {
            tr.classList.remove("saving");
            isEditingCloseTime = false;
            renderSchedule();
          }
        });

        closeTimeInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            closeTimeInput.blur();
          }

          if (e.key === "Escape") {
            e.preventDefault();
            closeTimeInput.value = event.heureFermeture || "";
            closeTimeInput.blur();
          }
        });
      });
    }

    updateDateAndClock();
    loadSchedule();

    setInterval(updateDateAndClock, 1000);

    setInterval(() => {
      if (!isEditingCloseTime) {
        renderSchedule();
      }
    }, 1000);

    setInterval(() => {
      if (!isEditingCloseTime) {
        loadSchedule();
      }
    }, 60000);
  </script>
</body>
</html>
