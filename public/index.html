<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ouverture / Fermeture des Feed</title>

  <style>
    :root {
      --orange-rg: #c95d2b;
      --green-rg: #006b4d;
      --blue-rg: #0f6680;
      --grey-line: #c9ced3;
      --grey-line-alt: #e6e9ec;
      --white: #ffffff;
      --black: #111111;

      --screen-padding: clamp(8px, 1.5vw, 24px);
      --orange-height: clamp(150px, 20vh, 230px);
      --logo-size: clamp(120px, 11vw, 190px);
      --title-size: clamp(28px, 3.1vw, 52px);
      --green-height: clamp(48px, 7vh, 76px);
      --date-size: clamp(20px, 2.8vw, 44px);
      --table-header-size: clamp(14px, 1.35vw, 24px);
      --table-text-size: clamp(14px, 1.25vw, 22px);
      --row-height: clamp(32px, 4.2vh, 46px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      overflow: hidden;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      padding: var(--screen-padding);
      background: #f2f2f2;
    }

    .container {
      width: 100%;
      height: 100%;
      background: white;
      border: 1px solid #dddddd;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top-band {
      height: var(--orange-height);
      min-height: var(--orange-height);
      background: var(--orange-rg);
      display: grid;
      grid-template-columns: minmax(180px, 20vw) 1fr minmax(180px, 20vw);
      align-items: center;
      justify-items: center;
      padding: 0 clamp(24px, 4vw, 70px) clamp(8px, 1.2vh, 16px);
      overflow: hidden;
    }

    .logo {
      width: var(--logo-size);
      height: var(--logo-size);
      object-fit: contain;
      display: block;
    }

    .logo.left {
      justify-self: start;
      align-self: center;
    }

    .logo.right {
      justify-self: center;
      align-self: center;
    }

    .hidden-edit-btn {
      width: var(--logo-size);
      height: var(--logo-size);
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      cursor: default;
      justify-self: end;
      align-self: center;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
    }

    .hidden-edit-btn .logo {
      pointer-events: none;
    }

    .main-title {
      height: 100%;
      text-align: center;
      font-size: var(--title-size);
      font-weight: 900;
      letter-spacing: clamp(1px, 0.15vw, 2px);
      text-transform: uppercase;
      line-height: 0.95;
      color: white;
      white-space: normal;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .main-title span {
      display: block;
      width: 100%;
      text-align: center;
    }

    .green-info-bar {
      height: var(--green-height);
      min-height: var(--green-height);
      background: var(--green-rg);
      display: grid;
      grid-template-columns: minmax(220px, 22vw) 1fr minmax(220px, 24vw);
      align-items: center;
      padding: 0 clamp(16px, 3vw, 50px);
      border-top: 3px solid white;
    }

    .green-actions {
      grid-column: 1;
      justify-self: start;
      align-self: center;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .fullscreen-btn,
    .sound-btn,
    .refresh-btn {
      width: 46px;
      height: 46px;
      border: 2px solid white;
      border-radius: 8px;
      background: transparent;
      color: white;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      line-height: 1;
    }

    .fullscreen-btn:hover,
    .sound-btn:hover,
    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .fullscreen-btn:active,
    .sound-btn:active,
    .refresh-btn:active {
      transform: scale(0.96);
    }

    .sound-btn.sound-enabled {
      background: rgba(255, 255, 255, 0.22);
    }

    .edit-indicator {
      display: none;
      color: white;
      font-size: 30px;
      font-weight: 900;
      line-height: 1;
    }

    .edit-indicator.visible {
      display: inline-block;
    }

    .date-zone {
      grid-column: 2;
      text-align: center;
      font-size: var(--date-size);
      font-weight: 900;
      text-transform: uppercase;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .clock-report-zone {
      grid-column: 3;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .clock-zone {
      text-align: right;
      font-size: var(--date-size);
      font-weight: 900;
      text-transform: uppercase;
      color: white;
      white-space: nowrap;
    }

    .report-btn {
      border: 2px solid white;
      border-radius: 8px;
      background: transparent;
      color: white;
      font-size: clamp(14px, 1.1vw, 20px);
      font-weight: 900;
      padding: 8px 14px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .report-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .report-btn:not(:disabled):hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .table-zone {
      flex: 1;
      background: white;
      padding-top: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    .schedule {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }

    .schedule thead {
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .schedule thead tr {
      background: var(--blue-rg);
      height: var(--row-height);
    }

    .schedule th {
      position: sticky;
      top: 0;
      z-index: 21;
      background: var(--blue-rg);
      color: white;
      text-align: left;
      font-size: var(--table-header-size);
      padding: clamp(4px, 0.7vw, 8px) clamp(7px, 1vw, 12px);
      border: 2px solid white;
      font-weight: 900;
      white-space: nowrap;
      vertical-align: middle;
    }

    .schedule td {
      height: var(--row-height);
      font-size: var(--table-text-size);
      color: var(--black);
      padding: clamp(4px, 0.7vw, 8px) clamp(7px, 1vw, 12px);
      border: 2px solid white;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }

    .schedule tbody tr {
      background: var(--grey-line);
    }

    .schedule tbody tr:nth-child(even) {
      background: var(--grey-line-alt);
    }

    .schedule tr,
    .schedule td,
    .schedule th {
      outline: none !important;
      box-shadow: none !important;
    }

    .overdue-unclosed td {
      color: #d00000 !important;
      font-weight: 900;
    }

    .overdue-unclosed .close-time-input {
      color: #d00000 !important;
      font-weight: 900;
    }

    .overdue-unclosed .close-time-input:disabled {
      color: #d00000 !important;
    }

    .pending-remove {
      opacity: 0.55;
      transition: opacity 0.3s ease;
    }

    .pending-remove td {
      text-decoration: line-through;
    }

    .col-time,
    .col-court,
    .col-close {
      width: 1%;
      white-space: nowrap;
    }

    .col-close-time {
      width: 1%;
      min-width: 200px;
      white-space: nowrap;
    }

    .col-feed {
      width: auto;
    }

    .schedule td:nth-child(1),
    .schedule td:nth-child(2),
    .schedule td:nth-child(4),
    .schedule td:nth-child(5) {
      width: 1%;
      white-space: nowrap;
    }

    .schedule td:nth-child(3) {
      width: auto;
      white-space: normal;
    }

    .schedule th:nth-child(1),
    .schedule td:nth-child(1),
    .schedule th:nth-child(4),
    .schedule td:nth-child(4),
    .schedule th:nth-child(5),
    .schedule td:nth-child(5) {
      text-align: center;
    }

    .schedule th:nth-child(1),
    .schedule th:nth-child(5) {
      white-space: normal;
      line-height: 1.05;
    }

    .close-checkbox {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: var(--green-rg);
    }

    .close-checkbox:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .close-time-input {
      width: 130px;
      max-width: 100%;
      font-size: clamp(14px, 1.25vw, 22px);
      font-weight: 900;
      padding: 4px 7px;
      border: 2px solid #ffffff;
      background: #ffffff;
      color: #111111;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0 auto;
      display: block;
    }

    .close-time-input:disabled {
      background: #eeeeee;
      color: #555555;
      cursor: not-allowed;
    }

    .close-time-input:focus {
      outline: 3px solid var(--blue-rg) !important;
    }

    .saving {
      opacity: 0.6;
    }

    .empty-message {
      text-align: center;
      color: #333333;
      font-size: clamp(18px, 1.8vw, 26px);
      padding: 24px;
    }

    .warning {
      animation: blinkRed 0.8s infinite;
      cursor: pointer;
    }

    .warning td {
      color: white;
      font-weight: 900;
    }

    .warning .close-time-input {
      color: #111111;
    }

    .warning .close-time-input:disabled {
      color: #555555;
    }

    @keyframes blinkRed {
      0% { background: #9b0000; }
      50% { background: #ff0000; }
      100% { background: #9b0000; }
    }

    .past {
      opacity: 0.35;
    }

    .past .close-checkbox,
    .past .close-time-input {
      opacity: 1;
    }

    .report-modal.hidden {
      display: none;
    }

    .report-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .report-modal-content {
      width: min(1100px, 96vw);
      max-height: 92vh;
      background: white;
      color: #111111;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .report-modal-header {
      background: var(--orange-rg);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .report-modal-header h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .report-close-btn {
      width: 42px;
      height: 42px;
      border: 2px solid white;
      border-radius: 8px;
      background: transparent;
      color: white;
      font-size: 28px;
      font-weight: 900;
      cursor: pointer;
      line-height: 1;
    }

    .report-modal-body {
      padding: 18px 20px;
      overflow-y: auto;
    }

    .report-date {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 12px;
      color: var(--green-rg);
    }

    .report-table-wrapper {
      overflow-x: auto;
      margin-bottom: 16px;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
    }

    .report-table th {
      background: var(--blue-rg);
      color: white;
      font-weight: 900;
      padding: 10px;
      border: 2px solid white;
      text-align: left;
    }

    .report-table td {
      background: #e6e9ec;
      color: #111111;
      font-weight: 700;
      padding: 10px;
      border: 2px solid white;
    }

    .report-remark-label {
      display: block;
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 8px;
      color: #111111;
    }

    .report-remark {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      font-size: 17px;
      font-family: Arial, Helvetica, sans-serif;
      padding: 12px;
      border: 2px solid var(--blue-rg);
      border-radius: 8px;
    }

    .report-modal-footer {
      padding: 14px 20px;
      background: #f2f2f2;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .report-save-btn,
    .report-send-btn {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
    }

    .report-save-btn {
      background: var(--green-rg);
      color: white;
    }

    .report-send-btn {
      background: var(--blue-rg);
      color: white;
    }

    .report-send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      :root {
        --screen-padding: 0px;
        --orange-height: auto;
        --green-height: auto;
        --logo-size: 54px;
        --title-size: 17px;
        --date-size: 16px;
        --table-header-size: 16px;
        --table-text-size: 16px;
        --row-height: auto;
      }

      html,
      body {
        width: 100%;
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        background: white;
      }

      .screen {
        width: 100%;
        min-height: 100vh;
        height: auto;
        padding: 0;
        background: white;
      }

      .container {
        width: 100%;
        min-height: 100vh;
        height: auto;
        border: none;
        overflow: visible;
      }

      .top-band {
        height: auto;
        min-height: 82px;
        grid-template-columns: 58px 1fr 58px;
        align-items: center;
        padding: 6px 8px;
      }

      .logo,
      .hidden-edit-btn {
        width: var(--logo-size);
        height: var(--logo-size);
      }

      .green-info-bar {
        height: auto;
        min-height: 92px;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        gap: 5px;
        padding: 8px 10px;
        border-top: 2px solid white;
      }

      .green-actions {
        grid-column: 1;
        grid-row: 3;
        justify-self: center;
        margin-top: 2px;
      }

      .date-zone {
        grid-column: 1;
        grid-row: 1;
        font-size: var(--date-size);
        white-space: normal;
        line-height: 1.15;
        text-align: center;
      }

      .clock-report-zone {
        grid-column: 1;
        grid-row: 2;
        justify-content: center;
        gap: 10px;
      }

      .clock-zone {
        text-align: center;
        font-size: 20px;
      }

      .fullscreen-btn,
      .sound-btn,
      .refresh-btn {
        width: 36px;
        height: 36px;
        font-size: 19px;
        border-radius: 7px;
      }

      .table-zone {
        padding-top: 0;
        overflow-y: visible;
        overflow-x: hidden;
        background: white;
      }

      .schedule {
        display: block;
        width: 100%;
        padding: 8px 8px 14px;
      }

      .schedule thead {
        display: none;
      }

      .schedule tbody {
        display: block;
        width: 100%;
      }

      .schedule tr {
        display: block;
        width: 100%;
        margin-bottom: 10px;
        border: 2px solid white;
        border-radius: 8px;
        overflow: hidden;
        background: var(--grey-line);
      }

      .schedule td {
        display: grid;
        grid-template-columns: 42% 58%;
        align-items: center;
        width: 100% !important;
        height: auto;
        min-height: 40px;
        font-size: var(--table-text-size);
        padding: 8px 10px;
        border: none;
        border-bottom: 1px solid white;
        white-space: normal !important;
        overflow: visible;
        text-overflow: unset;
        text-align: left !important;
        line-height: 1.15;
      }

      .schedule td::before {
        font-weight: 900;
        color: var(--blue-rg);
        padding-right: 8px;
      }

      .schedule td:nth-child(1)::before { content: "Ouverture"; }
      .schedule td:nth-child(2)::before { content: "Court"; }
      .schedule td:nth-child(3)::before { content: "Feed"; }
      .schedule td:nth-child(4)::before { content: "Close"; }
      .schedule td:nth-child(5)::before { content: "Fermeture"; }

      .close-checkbox {
        width: 28px;
        height: 28px;
        justify-self: start;
      }

      .close-time-input {
        width: 110px;
        font-size: 18px;
        justify-self: start;
        margin: 0;
        padding: 4px 6px;
      }

      .warning td,
      .warning td::before {
        color: white !important;
      }

      .report-modal {
        align-items: flex-start;
        padding: 10px;
      }

      .report-modal-content {
        width: 100%;
        max-height: 96vh;
        border-radius: 10px;
      }

      .report-modal-footer {
        flex-direction: column;
      }

      .report-save-btn,
      .report-send-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="screen">
    <div class="container">
      <header class="top-band">
        <img src="./logo-rg.png" alt="Roland Garros" class="logo left" />

        <div class="main-title">
          <span>OUVERTURE / FERMETURE</span>
          <span>DES FEED</span>
        </div>

        <button id="hidden-edit-btn" class="hidden-edit-btn" title="">
          <img src="./logo-rg.png" alt="Roland Garros" class="logo right" />
        </button>
      </header>

      <section class="green-info-bar">
        <div class="green-actions">
          <button id="fullscreen-btn" class="fullscreen-btn" title="Plein écran">⛶</button>
          <button id="sound-btn" class="sound-btn" title="Activer la voix">🔇</button>
          <button id="refresh-btn" class="refresh-btn" title="Actualiser depuis Airtable">↻</button>
          <span id="edit-indicator" class="edit-indicator">✎</span>
        </div>

        <div class="date-zone" id="date-du-jour">DATE DU JOUR</div>

        <div class="clock-report-zone">
          <button id="report-btn" class="report-btn" disabled>Report</button>
          <div class="clock-zone" id="heure-actuelle">HEURE</div>
        </div>
      </section>

      <main class="table-zone" id="table-zone">
        <table class="schedule">
          <thead>
            <tr>
              <th class="col-time">Heure<br>d’ouverture</th>
              <th class="col-court">Court</th>
              <th class="col-feed">Feed</th>
              <th class="col-close">Close</th>
              <th class="col-close-time">Heure<br>de fermeture</th>
            </tr>
          </thead>

          <tbody id="schedule-body">
            <tr>
              <td colspan="5" class="empty-message">Chargement...</td>
            </tr>
          </tbody>
        </table>
      </main>
    </div>
  </div>

  <div id="report-modal" class="report-modal hidden">
    <div class="report-modal-content">
      <div class="report-modal-header">
        <h2>Report du jour</h2>
        <button id="report-close-btn" class="report-close-btn">×</button>
      </div>

      <div class="report-modal-body">
        <div id="report-date" class="report-date"></div>

        <div class="report-table-wrapper">
          <table class="report-table">
            <thead>
              <tr>
                <th>Heure ouverture</th>
                <th>Court</th>
                <th>Feed</th>
                <th>Close</th>
                <th>Heure fermeture</th>
              </tr>
            </thead>
            <tbody id="report-body">
              <tr>
                <td colspan="5">Chargement...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <label class="report-remark-label" for="report-remark">Remarque</label>

        <textarea
          id="report-remark"
          class="report-remark"
          placeholder="Ajouter une remarque..."
        ></textarea>
      </div>

      <div class="report-modal-footer">
        <button id="report-save-btn" class="report-save-btn">Enregistrer</button>
        <button id="report-send-btn" class="report-send-btn">Envoyer</button>
      </div>
    </div>
  </div>

  <script>
    let events = [];
    let isEditingCloseTime = false;
    let lastAutoScrolledRecordId = null;
    let editMode = false;

    let soundEnabled = false;
    let speechIsPlaying = false;
    let warningCourtQueue = [];
    let acknowledgedWarningIds = new Set();
    let lastWarningSignature = "";
    let speechTimeout = null;

    const pendingRemovalIds = new Set();

    function getTodayParis() {
      return new Intl.DateTimeFormat("fr-CA", {
        timeZone: "Europe/Paris",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function getEventDateTime(event) {
      if (event.datetime) {
        const directDate = new Date(event.datetime);

        if (!isNaN(directDate.getTime())) {
          return directDate;
        }
      }

      if (!event.date || !event.heure) {
        return null;
      }

      const time = String(event.heure).trim();

      if (!/^\d{2}:\d{2}$/.test(time)) {
        return null;
      }

      return new Date(`${event.date}T${time}:00`);
    }

    function sortEventsForDisplay(eventsToSort) {
      return [...eventsToSort].sort((a, b) => {
        const timeA = a.heure || "";
        const timeB = b.heure || "";

        if (timeA !== timeB) {
          return timeA.localeCompare(timeB, "fr", {
            numeric: true,
            sensitivity: "base"
          });
        }

        const courtA = a.court || "";
        const courtB = b.court || "";

        return courtA.localeCompare(courtB, "fr", {
          numeric: true,
          sensitivity: "base"
        });
      });
    }

    function getLocalStateKey() {
      return `feedScheduleLocalState:${getTodayParis()}`;
    }

    function getLocalRemarkKey() {
      return `feedReportRemark:${getTodayParis()}`;
    }

    function saveLocalState() {
      const state = events.map(event => ({
        id: event.id,
        date: event.date,
        close: Boolean(event.close),
        heureFermeture: event.heureFermeture || "",
        modifiedLocally: Boolean(event.modifiedLocally)
      }));

      localStorage.setItem(getLocalStateKey(), JSON.stringify(state));
    }

    function restoreLocalState() {
      const saved = localStorage.getItem(getLocalStateKey());

      if (!saved) {
        return;
      }

      let localEvents = [];

      try {
        localEvents = JSON.parse(saved);
      } catch (error) {
        localEvents = [];
      }

      events = events.map(event => {
        const localEvent = localEvents.find(item => item.id === event.id);

        if (!localEvent) {
          return event;
        }

        return {
          ...event,
          close: Boolean(localEvent.close),
          heureFermeture: localEvent.heureFermeture || "",
          modifiedLocally: Boolean(localEvent.modifiedLocally)
        };
      });
    }

    function hasLocalModifications() {
      return events.some(event => event.modifiedLocally);
    }

    function clearLocalModifications() {
      events = events.map(event => ({
        ...event,
        modifiedLocally: false
      }));

      saveLocalState();
    }

    function getTodayEvents() {
      const todayParis = getTodayParis();

      return events.filter(event => event.date === todayParis);
    }

    function isOldEvent(event) {
      return event.date && event.date < getTodayParis();
    }

    function scheduleRemoveOldEvent(event) {
      if (!event || !event.id || !isOldEvent(event)) {
        return;
      }

      if (pendingRemovalIds.has(event.id)) {
        return;
      }

      pendingRemovalIds.add(event.id);

      const row = document.querySelector(`tr[data-id="${event.id}"]`);

      if (row) {
        row.classList.add("pending-remove");
      }

      setTimeout(() => {
        events = events.filter(item => item.id !== event.id);
        pendingRemovalIds.delete(event.id);
        saveLocalState();
        renderSchedule();
      }, 3000);
    }

    function areAllTodayRowsClosed() {
      const todayEvents = getTodayEvents();

      if (!todayEvents.length) {
        return false;
      }

      return todayEvents.every(event => event.close === true);
    }

    function updateReportButtonState() {
      const reportButton = document.getElementById("report-btn");

      if (!reportButton) {
        return;
      }

      reportButton.disabled = !areAllTodayRowsClosed();
    }

    function speakOneCourt(courtText, onEnd) {
      if (!soundEnabled || !courtText) {
        return;
      }

      if (!("speechSynthesis" in window)) {
        console.warn("Synthèse vocale non disponible sur ce navigateur.");
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(`OUVERTURE ${courtText}`);
      utterance.lang = "fr-FR";
      utterance.rate = 0.85;
      utterance.pitch = 1;
      utterance.volume = 1;

      utterance.onend = () => {
        if (typeof onEnd === "function") {
          onEnd();
        }
      };

      utterance.onerror = () => {
        if (typeof onEnd === "function") {
          onEnd();
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    function speakCourtsSequentially(courts, index = 0) {
      if (!soundEnabled || !Array.isArray(courts) || !courts.length) {
        return;
      }

      if (index >= courts.length) {
        speechTimeout = setTimeout(() => {
          speakCourtsSequentially(courts, 0);
        }, 10000);

        return;
      }

      const courtText = courts[index];

      speakOneCourt(courtText, () => {
        speechTimeout = setTimeout(() => {
          speakCourtsSequentially(courts, index + 1);
        }, 10000);
      });
    }

    function startAlarm(courtTexts) {
      if (!soundEnabled || !Array.isArray(courtTexts) || !courtTexts.length) {
        return;
      }

      const uniqueCourts = [...new Set(courtTexts.filter(Boolean))];

      if (!uniqueCourts.length) {
        return;
      }

      const signature = uniqueCourts.join("|");

      if (speechIsPlaying && lastWarningSignature === signature) {
        return;
      }

      stopAlarm();

      speechIsPlaying = true;
      warningCourtQueue = uniqueCourts;
      lastWarningSignature = signature;

      speakCourtsSequentially(uniqueCourts, 0);
    }

    function stopAlarm() {
      speechIsPlaying = false;
      warningCourtQueue = [];
      lastWarningSignature = "";

      if (speechTimeout) {
        clearTimeout(speechTimeout);
        speechTimeout = null;
      }

      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    }

    function clearOldAcknowledgements() {
      const activeIds = new Set(events.map(event => event.id));

      acknowledgedWarningIds.forEach(id => {
        if (!activeIds.has(id)) {
          acknowledgedWarningIds.delete(id);
        }
      });
    }

    async function loadSchedule({ force = false } = {}) {
      if (hasLocalModifications() && force) {
        const confirmRefresh = confirm(
          "Des modifications locales ne sont pas encore enregistrées dans Airtable. Les remplacer par les données Airtable ?"
        );

        if (!confirmRefresh) {
          return;
        }

        localStorage.removeItem(getLocalStateKey());
      }

      try {
        const response = await fetch("/api/schedule");

        if (!response.ok) {
          throw new Error("Erreur API");
        }

        const data = await response.json();

        events = Array.isArray(data) ? data : data.events || [];

        if (!force) {
          restoreLocalState();
        }

        clearOldAcknowledgements();
        renderSchedule();

      } catch (error) {
        document.getElementById("schedule-body").innerHTML = `
          <tr>
            <td colspan="5" class="empty-message">
              Erreur de chargement du schedule
            </td>
          </tr>
        `;
      }
    }

    function openReportModal() {
      const modal = document.getElementById("report-modal");
      const reportDate = document.getElementById("report-date");
      const reportBody = document.getElementById("report-body");
      const reportRemark = document.getElementById("report-remark");

      const todayParis = getTodayParis();
      const reportEvents = sortEventsForDisplay(getTodayEvents());

      modal.classList.remove("hidden");
      reportDate.textContent = `Date : ${todayParis}`;
      reportRemark.value = localStorage.getItem(getLocalRemarkKey()) || "";

      if (!reportEvents.length) {
        reportBody.innerHTML = `
          <tr>
            <td colspan="5">Aucune ligne pour aujourd'hui</td>
          </tr>
        `;
      } else {
        reportBody.innerHTML = reportEvents.map(event => `
          <tr>
            <td>${event.heure || ""}</td>
            <td>${event.court || ""}</td>
            <td>${event.feed || ""}</td>
            <td>${event.close ? "Oui" : "Non"}</td>
            <td>${event.heureFermeture || ""}</td>
          </tr>
        `).join("");
      }
    }

    function closeReportModal() {
      const modal = document.getElementById("report-modal");

      if (modal) {
        modal.classList.add("hidden");
      }
    }

    async function saveReportRemark() {
      const reportRemark = document.getElementById("report-remark");
      const saveButton = document.getElementById("report-save-btn");

      const todayParis = getTodayParis();

      try {
        saveButton.disabled = true;
        saveButton.textContent = "Enregistrement...";

        const response = await fetch("/api/report", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            date: todayParis,
            remarque: reportRemark.value || "",
            events: sortEventsForDisplay(getTodayEvents())
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || data.message || "Erreur enregistrement report");
        }

        localStorage.setItem(getLocalRemarkKey(), reportRemark.value || "");
        clearLocalModifications();

        saveButton.textContent = "Enregistré";

        setTimeout(() => {
          saveButton.textContent = "Enregistrer";
          saveButton.disabled = false;
        }, 1500);

      } catch (error) {
        alert(`Erreur lors de l'enregistrement : ${error.message}`);
        saveButton.textContent = "Enregistrer";
        saveButton.disabled = false;
      }
    }

    async function sendReportByEmail() {
      const sendButton = document.getElementById("report-send-btn");
      const reportRemark = document.getElementById("report-remark");

      const todayParis = getTodayParis();

      try {
        sendButton.disabled = true;
        sendButton.textContent = "Envoi...";

        const response = await fetch("/api/send-report", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            date: todayParis,
            remarque: reportRemark.value || "",
            events: sortEventsForDisplay(getTodayEvents())
          })
        });

        const data = await response.json();

        if (!response.ok) {
          const detail =
            data.details?.message ||
            data.details?.error ||
            data.message ||
            data.error ||
            JSON.stringify(data);

          throw new Error(detail);
        }

        localStorage.setItem(getLocalRemarkKey(), reportRemark.value || "");
        clearLocalModifications();

        sendButton.textContent = "Envoyé";

        alert(`Report envoyé avec succès à ${data.recipients.length} destinataire(s).`);

        setTimeout(() => {
          closeReportModal();
          sendButton.textContent = "Envoyer";
          sendButton.disabled = false;
        }, 1500);

      } catch (error) {
        alert(`Erreur lors de l'envoi du report : ${error.message}`);
        sendButton.textContent = "Envoyer";
        sendButton.disabled = false;
      }
    }

    function setupReportModal() {
      const reportButton = document.getElementById("report-btn");
      const closeButton = document.getElementById("report-close-btn");
      const saveButton = document.getElementById("report-save-btn");
      const sendButton = document.getElementById("report-send-btn");
      const modal = document.getElementById("report-modal");

      if (reportButton) {
        reportButton.addEventListener("click", openReportModal);
      }

      if (closeButton) {
        closeButton.addEventListener("click", closeReportModal);
      }

      if (saveButton) {
        saveButton.addEventListener("click", saveReportRemark);
      }

      if (sendButton) {
        sendButton.addEventListener("click", sendReportByEmail);
      }

      if (modal) {
        modal.addEventListener("click", event => {
          if (event.target === modal) {
            closeReportModal();
          }
        });
      }
    }

    function setupHiddenEditButton() {
      const hiddenButton = document.getElementById("hidden-edit-btn");
      const indicator = document.getElementById("edit-indicator");

      if (!hiddenButton || !indicator) {
        return;
      }

      hiddenButton.addEventListener("click", () => {
        editMode = !editMode;

        if (editMode) {
          indicator.classList.add("visible");
        } else {
          indicator.classList.remove("visible");
        }

        renderSchedule();
      });
    }

    function setupFullscreenButton() {
      const button = document.getElementById("fullscreen-btn");
      const target = document.documentElement;

      if (!button) {
        return;
      }

      button.addEventListener("click", async () => {
        try {
          if (!document.fullscreenElement) {
            await target.requestFullscreen();
            button.textContent = "×";
          } else {
            await document.exitFullscreen();
            button.textContent = "⛶";
          }
        } catch (error) {
          alert("Le plein écran n'est pas autorisé par ce navigateur.");
          console.error(error);
        }
      });

      document.addEventListener("fullscreenchange", () => {
        button.textContent = document.fullscreenElement ? "×" : "⛶";
      });
    }

    function setupSoundButton() {
      const button = document.getElementById("sound-btn");

      if (!button) {
        return;
      }

      button.textContent = soundEnabled ? "🔊" : "🔇";

      if (soundEnabled) {
        button.classList.add("sound-enabled");
      } else {
        button.classList.remove("sound-enabled");
      }

      button.addEventListener("click", () => {
        soundEnabled = !soundEnabled;

        if (soundEnabled) {
          button.textContent = "🔊";
          button.classList.add("sound-enabled");

          if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();

            const test = new SpeechSynthesisUtterance("Annonces activées");
            test.lang = "fr-FR";
            test.volume = 0.01;
            window.speechSynthesis.speak(test);
          }

          renderSchedule();
        } else {
          button.textContent = "🔇";
          button.classList.remove("sound-enabled");
          stopAlarm();
        }
      });
    }

    function setupRefreshButton() {
      const refreshButton = document.getElementById("refresh-btn");

      if (!refreshButton) {
        return;
      }

      refreshButton.addEventListener("click", () => {
        loadSchedule({ force: true });
      });
    }

    function updateDateAndClock() {
      const now = new Date();

      const dateFormatted = now.toLocaleDateString("fr-FR", {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
      });

      const timeFormatted = now.toLocaleTimeString("fr-FR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

      document.getElementById("date-du-jour").textContent = dateFormatted;
      document.getElementById("heure-actuelle").textContent = timeFormatted;
    }

    function getCurrentParisTime() {
      const now = new Date();

      return now.toLocaleTimeString("fr-FR", {
        timeZone: "Europe/Paris",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    function formatTimeInput(value) {
      const digits = value.replace(/\D/g, "").slice(0, 4);

      if (digits.length <= 2) {
        return digits;
      }

      return `${digits.slice(0, 2)}:${digits.slice(2)}`;
    }

    function getActiveRecordId(now) {
      if (!events.length) {
        return null;
      }

      let nextEvent = null;
      let nextDiff = Infinity;

      let lastPastEvent = null;
      let lastPastDiff = -Infinity;

      events.forEach(event => {
        const eventDate = getEventDateTime(event);

        if (!eventDate) {
          return;
        }

        const diff = eventDate - now;

        if (diff > 0 && diff < nextDiff) {
          nextDiff = diff;
          nextEvent = event;
        }

        if (diff <= 0 && diff > lastPastDiff) {
          lastPastDiff = diff;
          lastPastEvent = event;
        }
      });

      if (nextEvent) {
        return nextEvent.id;
      }

      if (lastPastEvent) {
        return lastPastEvent.id;
      }

      return null;
    }

    function scrollToActiveRow(activeRowElement) {
      if (!activeRowElement || isEditingCloseTime) {
        return;
      }

      const recordId = activeRowElement.dataset.id;

      if (recordId === lastAutoScrolledRecordId) {
        return;
      }

      lastAutoScrolledRecordId = recordId;

      activeRowElement.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    function renderSchedule() {
      if (isEditingCloseTime) {
        return;
      }

      const tbody = document.getElementById("schedule-body");
      tbody.innerHTML = "";

      if (!events.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="empty-message">
              Aucun feed prévu aujourd'hui
            </td>
          </tr>
        `;
        stopAlarm();
        updateReportButtonState();
        return;
      }

      const now = new Date();
      const todayParis = getTodayParis();
      const activeRecordId = getActiveRecordId(now);

      let hasWarningLine = false;
      let warningCourtsToSpeak = [];
      let activeRowElement = null;

      sortEventsForDisplay(events).forEach(event => {
        const eventDate = getEventDateTime(event);
        const diff = eventDate ? eventDate - now : null;

        const isLessThan2Minutes =
          diff !== null &&
          diff > 0 &&
          diff <= 2 * 60 * 1000;

        const isPast =
          diff !== null &&
          diff <= 0;

        const isOldUnclosed =
          event.date &&
          event.date < todayParis &&
          !event.close;

        const tr = document.createElement("tr");
        tr.dataset.id = event.id;

        if (pendingRemovalIds.has(event.id)) {
          tr.classList.add("pending-remove");
        }

        if (isLessThan2Minutes) {
          tr.classList.add("warning");
          hasWarningLine = true;

          if (!acknowledgedWarningIds.has(event.id) && event.court) {
            warningCourtsToSpeak.push(event.court);
          }
        }

        if (isPast) {
          tr.classList.add("past");
        }

        if (isOldUnclosed) {
          tr.classList.add("overdue-unclosed");
          tr.classList.remove("past");
        }

        if (event.id === activeRecordId) {
          activeRowElement = tr;
        }

        tr.innerHTML = `
          <td>${event.heure || ""}</td>
          <td>${event.court || ""}</td>
          <td>${event.feed || ""}</td>
          <td>
            <input
              type="checkbox"
              class="close-checkbox"
              data-id="${event.id}"
              ${event.close ? "checked" : ""}
              ${editMode ? "" : "disabled"}
            />
          </td>
          <td>
            <input
              type="text"
              inputmode="numeric"
              pattern="[0-9]{2}:[0-9]{2}"
              maxlength="5"
              class="close-time-input"
              data-id="${event.id}"
              value="${event.heureFermeture || ""}"
              placeholder="HH:MM"
              ${editMode ? "" : "disabled"}
            />
          </td>
        `;

        tbody.appendChild(tr);

        tr.addEventListener("click", eventClick => {
          const clickedInput =
            eventClick.target.classList.contains("close-checkbox") ||
            eventClick.target.classList.contains("close-time-input");

          if (clickedInput) {
            return;
          }

          if (tr.classList.contains("warning")) {
            acknowledgedWarningIds.add(event.id);

            if ("speechSynthesis" in window) {
              window.speechSynthesis.cancel();
            }

            renderSchedule();
          }
        });

        const checkbox = tr.querySelector(".close-checkbox");
        const closeTimeInput = tr.querySelector(".close-time-input");

        checkbox.addEventListener("change", () => {
          if (!editMode) {
            return;
          }

          const isChecked = checkbox.checked;
          let fermetureValue = closeTimeInput.value.trim();

          if (isChecked && !fermetureValue) {
            fermetureValue = getCurrentParisTime();
            closeTimeInput.value = fermetureValue;
          }

          if (!isChecked) {
            fermetureValue = "";
            closeTimeInput.value = "";
          }

          event.close = isChecked;
          event.heureFermeture = fermetureValue;
          event.modifiedLocally = true;

          saveLocalState();
          updateReportButtonState();

          if (isOldEvent(event) && isChecked) {
            scheduleRemoveOldEvent(event);
          }
        });

        closeTimeInput.addEventListener("focus", () => {
          if (!editMode) {
            closeTimeInput.blur();
            return;
          }

          isEditingCloseTime = true;
        });

        closeTimeInput.addEventListener("input", () => {
          if (!editMode) {
            return;
          }

          closeTimeInput.value = formatTimeInput(closeTimeInput.value);
        });

        closeTimeInput.addEventListener("blur", () => {
          if (!editMode) {
            isEditingCloseTime = false;
            return;
          }

          const fermetureValue = closeTimeInput.value.trim();

          event.heureFermeture = fermetureValue;
          event.modifiedLocally = true;

          saveLocalState();
          updateReportButtonState();

          isEditingCloseTime = false;

          if (isOldEvent(event) && fermetureValue) {
            scheduleRemoveOldEvent(event);
          } else {
            renderSchedule();
          }
        });

        closeTimeInput.addEventListener("keydown", eventKey => {
          if (!editMode) {
            return;
          }

          if (eventKey.key === "Enter") {
            eventKey.preventDefault();
            closeTimeInput.blur();
          }

          if (eventKey.key === "Escape") {
            eventKey.preventDefault();
            closeTimeInput.value = event.heureFermeture || "";
            closeTimeInput.blur();
          }
        });
      });

      if (hasWarningLine && warningCourtsToSpeak.length) {
        startAlarm(warningCourtsToSpeak);
      } else {
        stopAlarm();
      }

      updateReportButtonState();
      scrollToActiveRow(activeRowElement);
    }

    setupFullscreenButton();
    setupSoundButton();
    setupRefreshButton();
    setupHiddenEditButton();
    setupReportModal();
    updateDateAndClock();
    loadSchedule();

    setInterval(updateDateAndClock, 1000);

    setInterval(() => {
      if (!isEditingCloseTime) {
        renderSchedule();
      }
    }, 1000);
  </script>
</body>
</html>
